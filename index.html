<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<title>הסוויטה של רום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&family=Frank+Ruhl+Libre:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D view; quiet smoked-glass chrome hugging the edges, plan minimap as the one "drawing" element */
:root{
  --ink:#f4f1ec; --ink-dim:#c9c3ba; --glass:rgba(28,27,25,.58); --glass-hi:rgba(48,46,43,.78);
  --line:rgba(255,248,236,.16); --led:#ffd7a1; --bg:#151413;
  --f-display:"Frank Ruhl Libre","David Libre",Georgia,serif;
  --f-body:"Assistant","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
#app{position:fixed;inset:0;touch-action:none}
canvas#view{display:block;width:100%;height:100%;outline:none}
.chrome{position:fixed;z-index:5;direction:rtl}
.panel{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px}
#top{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;left:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#title{padding:10px 14px;pointer-events:auto;max-width:60%}
#title h1{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0;line-height:1.15;letter-spacing:.01em}
#title p{margin:3px 0 0;font-size:12.5px;color:var(--ink-dim)}
#where{font-size:12.5px;color:var(--led)}
#tools{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;direction:rtl}
button{font:600 13px/1 var(--f-body);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
button:hover{background:var(--glass-hi)}
button:focus-visible{outline:2px solid var(--led);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--led);color:var(--led)}
#places{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:12px;left:12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;justify-content:center;pointer-events:auto}
#places::-webkit-scrollbar{display:none}
#places button{white-space:nowrap;flex:0 0 auto}
#mapwrap{bottom:calc(env(safe-area-inset-bottom,0px) + 62px);left:12px;padding:6px;width:min(330px,calc(100vw - 24px));pointer-events:auto;direction:ltr}
#mapwrap canvas{display:block;width:100%;height:auto;border-radius:7px;cursor:crosshair}
#mapwrap .cap{direction:rtl;font-size:11.5px;color:var(--ink-dim);padding:4px 4px 0;display:flex;justify-content:space-between}
#help{bottom:calc(env(safe-area-inset-bottom,0px) + 62px);right:12px;padding:10px 13px;font-size:12.5px;line-height:1.55;max-width:250px;color:var(--ink-dim)}
#help b{color:var(--ink);font-weight:600}
#loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--bg);direction:rtl;transition:opacity .6s}
#loading .box{text-align:center;max-width:300px;padding:0 16px}
#loading h2{font-family:var(--f-display);font-weight:500;font-size:28px;margin:0 0 6px}
#loading p{color:var(--ink-dim);margin:0 0 16px;font-size:14px}
#bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--led);transition:width .3s}
#joy{position:fixed;z-index:4;width:110px;height:110px;border-radius:50%;border:1px solid var(--line);background:rgba(20,19,18,.25);display:none;pointer-events:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,240,220,.35)}
#hint{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);direction:rtl;padding:12px 16px;font-size:14px;text-align:center;pointer-events:none;transition:opacity .5s}
@media (max-width:700px){
  #help{display:none}
  #title{max-width:52%}
  #title h1{font-size:17px}
  #mapwrap{width:min(250px,calc(100vw - 24px))}
  button{padding:8px 11px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){#loading,#hint,#bar i{transition:none}}
</style>

</div>

<div id="places" class="chrome"></div>
<div id="joy"><i></i></div>
<div id="hint" class="panel chrome" hidden></div>

</div></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---- faster lighting, identical image: skip a light's work where it adds exactly nothing ---- */
{
  let c = THREE.ShaderChunk.lights_fragment_begin;
  const n0 = c.length;
  // point + spot: out of range / outside the cone -> no shadow lookup, no BRDF
  c = c.replace(/(getPointLightInfo\( pointLight, geometryPosition, directLight \);)/, '$1\n\t\tif ( directLight.visible ) {')
       .replace(/(getSpotLightInfo\( spotLight, geometryPosition, directLight \);)/, '$1\n\t\tif ( directLight.visible ) {');
  let k = 0;
  c = c.replace(/(RE_Direct\( directLight, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight \);)/g, m => (k++ < 2 ? m + '\n\t\t}' : m));
  // rect area: behind the light, or the whole rectangle below the surface horizon
  c = c.replace('rectAreaLight = rectAreaLights[ i ];\n\t\tRE_Direct_RectArea(', `rectAreaLight = rectAreaLights[ i ];
		raD = rectAreaLight.position - geometryPosition;
		if ( dot( cross( rectAreaLight.halfWidth, rectAreaLight.halfHeight ), raD ) >= 0.0 &&
		     dot( geometryNormal, raD ) + abs( dot( geometryNormal, rectAreaLight.halfWidth ) ) + abs( dot( geometryNormal, rectAreaLight.halfHeight ) ) > 0.0 )
		RE_Direct_RectArea(`).replace('RectAreaLight rectAreaLight;', 'RectAreaLight rectAreaLight;\n\tvec3 raD;');
  if (k !== 3 || c.length === n0 || !c.includes('raD')) console.warn('light patch not applied');
  else THREE.ShaderChunk.lights_fragment_begin = c;
}

/* ------------------------------------------------------------------
   Coordinates follow the plan: x = along the suite (0 = bathroom outer
   wall, 14.90 = garden window), z = across (0 = "upper" wall with the
   shower/headboard/TV wall, 5.00 = "lower" wall with vanity/wardrobe/
   entry/desk-bar). y = up, metres. Ceiling 2.70, bathroom floor +0.15.
------------------------------------------------------------------- */
const L = 14.90, W = 5.0, H = 2.70, BATH_X = 2.55, BATH_Y = 0.15;
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const lowEnd = false; // one quality level: high

const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, // FXAA in the composer does the smoothing
   powerPreference: 'high-performance', preserveDrawingBuffer: !!window.__TEST__ });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, 1, 0.05, 200);
camera.rotation.order = 'YXZ';

/* ---------------- loading ---------------- */
const barEl = document.querySelector('#bar i');
const manager = new THREE.LoadingManager();
manager.onProgress = (u, a, b) => { barEl.style.width = Math.round(a / b * 85) + '%'; };
const texLoader = new THREE.TextureLoader(manager);
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function loadTex(url, rx, ry, srgb = true) {
  const t = texLoader.load(url);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.anisotropy = Math.min(8, maxAniso);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ---------------- procedural textures ---------------- */
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function canvasTex(size, draw, rx = 1, ry = 1, srgb = true) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = Math.min(8, maxAniso);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function woodTex(base, dark, light, seed, streaks = 260) {
  return canvasTex(1024, (g, s) => {
    const r = rng(seed);
    g.fillStyle = base; g.fillRect(0, 0, s, s);
    for (let i = 0; i < streaks; i++) {
      const x = r() * s, w = 0.6 + r() * 3.5;
      g.globalAlpha = 0.05 + r() * 0.13;
      g.fillStyle = r() > 0.5 ? dark : light;
      g.beginPath();
      let px = x; g.moveTo(px, 0);
      for (let y = 0; y <= s; y += 32) { px += (r() - 0.5) * 3; g.lineTo(px, y); }
      for (let y = s; y >= 0; y -= 32) { g.lineTo(px + w, y); }
      g.fill();
    }
    g.globalAlpha = 1;
  });
}
function noiseTex(base, amp, seed, size = 512, fiber = false) {
  return canvasTex(size, (g, s) => {
    const r = rng(seed), img = g.createImageData(s, s), d = img.data;
    const c = new THREE.Color(base);
    for (let i = 0; i < s * s; i++) {
      let n = (r() - 0.5) * amp;
      if (fiber) { const x = i % s, y = (i / s) | 0; n += Math.sin(x * 0.9) * Math.sin(y * 0.9) * amp * 0.25; }
      d[i * 4] = Math.max(0, Math.min(255, c.r * 255 + n));
      d[i * 4 + 1] = Math.max(0, Math.min(255, c.g * 255 + n));
      d[i * 4 + 2] = Math.max(0, Math.min(255, c.b * 255 + n));
      d[i * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
}
const fabricBump = canvasTex(256, (g, s) => {
  const r = rng(7), img = g.createImageData(s, s), d = img.data;
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const v = 128 + (r() - 0.5) * 90 + ((x + y) % 4 < 2 ? 18 : -18);
    const i = (y * s + x) * 4; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}, 6, 6, false);

// Photo-based stone: each texture covers 1.20 × 2.40 m (2 × 2 tiles of 60 × 120 cm)
const T = {
  bath: loadTex('tex/stone_bath.jpg', 1 / 1.2, 1 / 2.4),
  bathB: loadTex('tex/stone_bath_bump.jpg', 1 / 1.2, 1 / 2.4, false),
  floor: loadTex('tex/stone_floor.jpg', 1 / 1.2, 1 / 2.4),
  floorB: loadTex('tex/stone_floor_bump.jpg', 1 / 1.2, 1 / 2.4, false),

const planImg = new Image(); planImg.src = 'tex/plan.png';

const M = {};
M.floor = new THREE.MeshPhysicalMaterial({ map: T.floor, bumpMap: T.floorB, bumpScale: 0.6, roughness: 0.32, clearcoat: 0.25, clearcoatRoughness: 0.25, envMapIntensity: 0.7 });
M.bathFloor = new THREE.MeshPhysicalMaterial({ map: T.bath, bumpMap: T.bathB, bumpScale: 0.8, roughness: 0.5, envMapIntensity: 0.5 });
M.bathWall = new THREE.MeshPhysicalMaterial({ map: T.bath, bumpMap: T.bathB, bumpScale: 0.5, roughness: 0.38, clearcoat: 0.2, envMapIntensity: 0.55 });
M.paint = new THREE.MeshStandardMaterial({ color: 0xf1eee8, roughness: 0.92 });
M.ceiling = new THREE.MeshStandardMaterial({ color: 0xf5f3ef, roughness: 0.95 });
M.whiteWood = new THREE.MeshPhysicalMaterial({ color: 0xf3f1ec, roughness: 0.32, clearcoat: 0.35, clearcoatRoughness: 0.3 });
M.acrylic = new THREE.MeshPhysicalMaterial({ map: T.acr, color: 0xe9e8e4, metalness: 0.72, roughness: 0.16, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 1.25 });
M.acrylic.userData.reflective = true;
M.glass = new THREE.MeshPhysicalMaterial({ color: 0xe8f0ee, roughness: 0.03, metalness: 0, transparent: true, opacity: 0.12, envMapIntensity: 1.4, side: THREE.DoubleSide, depthWrite: false });
M.glass.userData.reflective = true;
M.winGlass = new THREE.MeshPhysicalMaterial({ color: 0xf0f6f4, roughness: 0.02, transparent: true, opacity: 0.05, envMapIntensity: 0.6, side: THREE.DoubleSide, depthWrite: false });

M.rug.map.repeat.set(2, 2);
M.rug2 = new THREE.MeshStandardMaterial({ map: noiseTex('#e2dbcf', 24, 9, 512, true), roughness: 1, bumpMap: fabricBump, bumpScale: 2 });
M.rug2.map.repeat.set(2, 2);
M.coffee = new THREE.MeshPhysicalMaterial({ map: T.floor, color: 0xf2efe9, roughness: 0.22, clearcoat: 0.6 });
M.plinth = new THREE.MeshStandardMaterial({ color: 0x2a2826, roughness: 0.8 });
M.grille = new THREE.MeshStandardMaterial({ color: 0x1d1c1b, roughness: 0.9 });
M.leaf = new THREE.MeshStandardMaterial({ color: 0x55703f, roughness: 0.75, flatShading: true });
M.leaf2 = new THREE.MeshStandardMaterial({ color: 0x6f8a4e, roughness: 0.75, flatShading: true });
M.leaf3 = new THREE.MeshStandardMaterial({ color: 0x3e5a35, roughness: 0.8, flatShading: true });
M.olive = new THREE.MeshStandardMaterial({ color: 0x8a9a74, roughness: 0.8, flatShading: true });
M.bark = new THREE.MeshStandardMaterial({ color: 0x6b5c4c, roughness: 0.95 });
M.pot = new THREE.MeshStandardMaterial({ color: 0xcfc8bd, roughness: 0.85 });
M.water = new THREE.MeshPhysicalMaterial({ color: 0xcfe3e6, roughness: 0.02, transparent: true, opacity: 0.45, envMapIntensity: 1.2 });
M.water.userData.reflective = true;
M.screen = new THREE.MeshStandardMaterial({ color: 0x07080a, roughness: 0.12, metalness: 0.0 });
M.curtain = new THREE.MeshStandardMaterial({ color: 0xf7f4ee, roughness: 1, transparent: true, opacity: 0.62, side: THREE.DoubleSide, depthWrite: false });
M.frame = new THREE.MeshStandardMaterial({ color: 0x34322f, metalness: 0.6, roughness: 0.4 });
const LED_C = new THREE.Color(0xffd3a0);
M.led = new THREE.MeshBasicMaterial({ color: LED_C.clone().multiplyScalar(4) });
M.ledSoft = new THREE.MeshBasicMaterial({ color: LED_C.clone().multiplyScalar(2.2) });
M.lamp = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffe2b8).multiplyScalar(3) });
M.downlight = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xfff0dc).multiplyScalar(2.5) });

/* ---------------- geometry helpers ---------------- */
function metricUV(geo, w, h, d) {
  const uv = geo.attributes.uv; const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
    const i = f * 4 + k; uv.setXY(i, uv.getX(i) * dims[f][0], uv.getY(i) * dims[f][1]);
  }
  uv.needsUpdate = true; return geo;
}
const world = new THREE.Group(); scene.add(world);
// Box from min corner to max corner (plan coordinates)
function B(x0, y0, z0, x1, y1, z1, mat, opt = {}) {
  const w = x1 - x0, h = y1 - y0, d = z1 - z0;
  const g = metricUV(new THREE.BoxGeometry(w, h, d), w, h, d);
  const m = new THREE.Mesh(g, mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.castShadow = opt.cast !== false; m.receiveShadow = true;
  (opt.parent || world).add(m); return m;
}
function RB(w, h, d, r, mat, x, y, z, parent = world, seg = 3) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2, h / 2, d / 2) - 0.0001), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function cyl(rt, rb, h, mat, x, y, z, seg = 32, parent = world) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
// Soft contact shadow (cheap ambient occlusion under furniture)
const blobTex = canvasTex(128, (g, s) => {
  const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.55, 'rgba(0,0,0,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);

/* ---------------- merge static furniture into few draw calls ---------------- */

/* ---------------- start ---------------- */
function start() {

  hintEl.innerHTML = isTouch ? 'אגודל שמאל להליכה · גרירה בצד ימין להסתכלות' : 'לחיצה על התמונה ואז W A S D והעכבר · או בחירת מקום למטה';

let started = false;
manager.onLoad = () => { if (!started) { started = true; requestAnimationFrame(start); } };

setTimeout(() => { if (!started) { started = true; start(); } }, 15000);

/* ==================================================================

================================================================== */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const KEYS = [
  // [camera position, look-at target]
  [V(L + 5.2, 1.75, 1.6), V(L, 1.35, 3.0)],
  [V(L + 2.7, 1.45, 3.0), V(L - 1, 1.25, 3.1)],
  [V(L + 0.4, 1.3, 3.12), V(12.6, 1.0, 2.8)],
  [V(13.4, 1.45, 3.05), V(11.9, 1.0, 0.6)],
  [V(12.2, 2.05, 2.6), V(11.9, 1.25, 0.3)],
  [V(10.6, 1.75, 1.5), V(9.6, 1.3, 0.3)],
  [V(9.2, 1.7, 2.6), V(6.5, 0.9, 1.2)],
  [V(7.3, 1.85, 3.4), V(5.2, 0.7, 1.0)],
  [V(5.4, 1.95, 3.45), V(5.2, 0.9, 0.2)],
  [V(4.3, 1.55, 2.6), V(2.5, 1.3, 2.1)],
  [V(3.2, 1.35, 2.1), V(1.5, 1.2, 2.2)],
  [V(2.05, 1.4, 2.1), V(0.6, 1.0, 3.0)],
  [V(1.65, 1.55, 3.45), V(0.97, 0.5, 3.01)],
  [V(1.25, 1.65, 3.95), V(1.22, 1.6, 5.0)],
  [V(2.0, 2.05, 3.65), V(9, 1.2, 2.5)],
  [V(2.2, 2.1, 3.5), V(14, 1.15, 2.5)],

const FLIGHT = 30; // seconds
function flightU(t) {
